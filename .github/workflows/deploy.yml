name: Test, snapshot and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the market snapshot hourly through the US session (13:45–20:45 UTC, Mon–Fri)
    - cron: "45 13-20 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pipeline tests and live data contract
        run: python -m pytest -q pipeline/tests
      - name: Build data snapshot
        run: python -m pipeline.snapshot

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Unit tests
        run: npx vitest run
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: Acceptance tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
